    const params = new URLSearchParams(location.search);
    const taskId = params.get('id');
    let currentUser = null;

    function toDate(value) {
      if (!value) return null;
      if (typeof value.toDate === 'function') return value.toDate();
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatDate(value) {
      const date = toDate(value);
      if (!date) return '記録なし';
      return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
    }

    function getTaskTitle(task) {
      return task.title || task.name || '無題のタスク';
    }

    // ===== 一覧モード =====
    async function initListMode() {
      document.getElementById('later-list-screen').style.display = '';

      const listEl = document.getElementById('later-task-list');
      const tasks = await loadTasks(currentUser.uid);
      const laterTasks = tasks.filter((task) => String(task.status || '').trim() === '後でやる');

      if (laterTasks.length === 0) {
        listEl.innerHTML = '<p class="task-list-empty">今「あとでやる」に入っているタスクはありません。</p>';
        return;
      }

      listEl.innerHTML = '';

      laterTasks.forEach((task) => {
        const card = document.createElement('div');
        card.className = 'task-card';
        applyLabelBar(card, task.color);

        card.innerHTML = `
          <div class="task-info">
            <h3>${getTaskTitle(task)}</h3>
            <p>後でやるにした回数：${task.laterCount || 0}回</p>
            <p>最後に後回しにした日：${formatDate(task.lastPostponedAt)}</p>
          </div>
          <div class="task-actions">
            <button class="later-complete-button">完了</button>
            <button class="later-edit-button">編集</button>
          </div>
        `;

        card.querySelector('.later-complete-button').addEventListener('click', async () => {
          if (!confirm('このタスクを完了にしますか？')) return;
          await completeTaskInFirestore(currentUser.uid, task);
          celebrateCompletion();
          card.remove();
        });

        card.querySelector('.later-edit-button').addEventListener('click', () => {
          location.href = `task-form.html?id=${task.id}`;
        });

        listEl.appendChild(card);
      });
    }

    // ===== 個別モード（いつやるか選ぶ） =====
    let currentTask = null;
    let messageType = 'normal';
    let pendingLaterTime = null;

    function showLaterMessage() {
      document.getElementById('later-message').textContent = pickPostponeMessage(messageType);
    }

    function openPostponeLimitModal(laterTime) {
      pendingLaterTime = laterTime;
      document.getElementById('postpone-limit-text').textContent =
        `このタスクはすでに${currentTask.laterCount || 0}回後回しにしています。どうしますか？`;
      const modal = document.getElementById('postpone-limit-modal');
      modal.classList.add('is-visible');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closePostponeLimitModal() {
      const modal = document.getElementById('postpone-limit-modal');
      modal.classList.remove('is-visible');
      modal.setAttribute('aria-hidden', 'true');
    }

    async function commitPostpone(laterTime) {
      await delayTaskWithLaterTime(currentUser.uid, taskId, laterTime);
      location.href = 'task-list.html';
    }

    async function selectLaterTime(button) {
      document.querySelectorAll('.later-time-button').forEach(function(optionButton) {
        optionButton.classList.remove('is-selected');
        optionButton.setAttribute('aria-pressed', 'false');
      });

      button.classList.add('is-selected');
      button.setAttribute('aria-pressed', 'true');
      const laterTime = button.dataset.value;

      if ((currentTask.laterCount || 0) >= POSTPONE_LIMIT) {
        openPostponeLimitModal(laterTime);
        return;
      }

      await commitPostpone(laterTime);
    }

    function initPostponeLimitButtons() {
      document.getElementById('postponeDoNowButton').addEventListener('click', async () => {
        await setTaskStatus(currentUser.uid, taskId, '未完了');
        location.href = 'task-list.html';
      });

      document.getElementById('postponeEditDueButton').addEventListener('click', () => {
        location.href = `task-form.html?id=${taskId}`;
      });

      document.getElementById('postponeConfirmButton').addEventListener('click', async () => {
        closePostponeLimitModal();
        await commitPostpone(pendingLaterTime);
      });
    }

    async function initPostponeMode() {
      document.getElementById('later-postpone-screen').style.display = '';

      currentTask = await loadTask(currentUser.uid, taskId);
      if (!currentTask) {
        location.href = 'task-list.html';
        return;
      }

      document.getElementById('later-task-title').textContent = getTaskTitle(currentTask);

      const userData = await loadUserData(currentUser.uid);
      messageType = (userData && userData.notificationSettings && userData.notificationSettings.messageType) || 'normal';
      showLaterMessage();

      document.querySelectorAll('.later-time-button').forEach(function(button) {
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', function() {
          selectLaterTime(button);
        });
      });

      initPostponeLimitButtons();
    }

    async function init() {
      currentUser = await requireAuth();
      initNavDrawer();

      if (taskId) {
        await initPostponeMode();
      } else {
        await initListMode();
      }
    }

    init();
  </script>
