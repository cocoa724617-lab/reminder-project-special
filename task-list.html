<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タスク一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>タスク一覧</h1>

  <section id="task-list-screen">
    <div class="task-card">
      <h3>今日までの課題を確認する</h3>
      <p>カテゴリ：課題</p>
      <p>優先度：高</p>
      <p>状態：未完了</p>
      <button>完了</button>
      <button>後でやる</button>
    </div>

    <div class="task-card">
      <h3>LINEの返信をする</h3>
      <p>カテゴリ：返信</p>
      <p>優先度：中</p>
      <p>状態：未完了</p>
      <button>完了</button>
      <button>後でやる</button>
    </div>

    <div class="task-card">
      <h3>明日の授業の持ち物を確認する</h3>
      <p>カテゴリ：持ち物</p>
      <p>優先度：中</p>
      <p>状態：未完了</p>
      <button>完了</button>
      <button>後でやる</button>
    </div>

    <a href="index.html" class="button-link">ホームに戻る</a>
  </section>
</body>
</html>
