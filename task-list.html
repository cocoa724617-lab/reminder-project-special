<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タスク一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>タスク一覧</h1>

  <section id="task-list-screen">
    <div id="task-list"></div>

    <a href="task-register.html" class="button-link">タスクを追加する</a>
    <a href="index.html" class="button-link">ホームに戻る</a>
  </section>

  <script>
    const taskList = document.getElementById("task-list");

    const tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    if (tasks.length === 0) {
      taskList.innerHTML = "<p>登録されたタスクはありません。</p>";
    } else {
      tasks.forEach(function(task, index) {
        const taskCard = document.createElement("div");
        taskCard.className = "task-card";

        taskCard.innerHTML = `
          <h3>${task.title}</h3>
          <p>期限：${task.date || "未設定"}</p>
          <p>カテゴリ：${task.category}</p>
          <p>優先度：${task.priority}</p>
          <p>状態：${task.status}</p>
          <p>メモ：${task.memo || "なし"}</p>
          <button onclick="completeTask(${index})">完了</button>
          <button onclick="delayTask(${index})">後でやる</button>
        `;

        taskList.appendChild(taskCard);
      });
    }

    function completeTask(index) {
      tasks[index].status = "完了";
      localStorage.setItem("tasks", JSON.stringify(tasks));
      location.reload();
    }

    function delayTask(index) {
      tasks[index].status = "後でやる";
      localStorage.setItem("tasks", JSON.stringify(tasks));
      location.reload();
    }
  </script>
</body>
</html>
