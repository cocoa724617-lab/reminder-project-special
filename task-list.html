<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タスク一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="task-list-page">
  <h1>タスク一覧</h1>

  <section id="task-list-screen">
    <div id="task-list"></div>

    <a href="task-form.html" class="button-link">タスクを追加する</a>
    <a href="index.html" class="button-link">ホームに戻る</a>
   
  </section>

  <script>
    function loadTasks() { return JSON.parse(localStorage.getItem('tasks') || '[]'); }
    function saveTasks(tasks) { localStorage.setItem('tasks', JSON.stringify(tasks)); }

    function loadTemp() { return JSON.parse(localStorage.getItem('tasks_temp') || '[]'); }
    function saveTemp(temp) { localStorage.setItem('tasks_temp', JSON.stringify(temp)); }

    function formatTaskPriority(priority) {
      const value = String(priority || '').trim().toLowerCase();

      if (value === 'high' || value === '高' || value.includes('高') || value.includes('鬮')) return '高';
      if (value === 'low' || value === '低' || value.includes('低') || value.includes('菴')) return '低';
      if (value === 'medium' || value === '中' || value.includes('中') || value.includes('荳')) return '中';
      return priority || '-';
    }

    const taskList = document.getElementById('task-list');

    function render() {
      const tasks = loadTasks();
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        taskList.innerHTML = '<p>登録されたタスクはありません。</p>';
        return;
      }

      const sortedIndices = tasks.map((_, i) => i);
      sortedIndices.sort(function(a, b) {
        const statusA = (tasks[a].status || '').trim();
        const statusB = (tasks[b].status || '').trim();
        const doneA = (statusA === '完了' || statusA === '後でやる') ? 1 : 0;
        const doneB = (statusB === '完了' || statusB === '後でやる') ? 1 : 0;
        return doneA - doneB;
      });

      sortedIndices.forEach(function(index) {
        const task = tasks[index];
        const taskCard = document.createElement('div');
        taskCard.className = 'task-card';

        taskCard.innerHTML = `
          <div class="task-info">
            <h3>${task.title || task.name || '(無題)'}</h3>
            <p>期限：${task.date || task.dueDate || '未設定'}</p>
            <p>カテゴリ：${task.category || '-'}</p>
            <p>優先度：${formatTaskPriority(task.priority || task.importance || task.priorityLevel)}</p>
            <p>状態：${task.status || '後でやる'}</p>
            <p>メモ：${task.memo || task.description || 'なし'}</p>
          </div>
          <div class="task-actions">
            <button id="complete-${index}">完了</button>
            <button id="delay-${index}">後でやる</button>
            <button id="edit-${index}">編集</button>
          </div>
        `;

        taskList.appendChild(taskCard);

        document.getElementById(`complete-${index}`).addEventListener('click', () => completeTask(index));
        document.getElementById(`delay-${index}`).addEventListener('click', () => delayTask(index));
        document.getElementById(`edit-${index}`).addEventListener('click', () => editTask(index));
      });
    }

    function completeTask(index) {
      if (!confirm('このタスクを完了（削除）しますか？')) return;
      const tasks = loadTasks();
      const removed = tasks.splice(index, 1)[0];
      saveTasks(tasks);

      // 一時保存に移動
      const temp = loadTemp();
      removed.deletedAt = new Date().toISOString();
      temp.push(removed);
      saveTemp(temp);

      render();
    }

    function delayTask(index) {
      const tasks = loadTasks();
      tasks[index].status = '後でやる';
      saveTasks(tasks);
      location.href = 'atodeyaru.html';
    }

    function editTask(index) {
      const tasks = loadTasks();
      const task = tasks[index];
      // タスクの id がなければ生成して保存 so edit via index -> open form without id might not edit
      if (task.id) {
        location.href = `task-form.html?id=${task.id}`;
      } else {
        // fallback: save tasks with generated ids and go to the edit page
        tasks.forEach((t, i) => { if (!t.id) t.id = Date.now().toString() + '_' + i; });
        saveTasks(tasks);
        location.href = `task-form.html?id=${tasks[index].id}`;
      }
    }

    render();
  </script>

<nav class="bottom-nav">
  <a href="index.html">
    <span class="icon">🏠</span>
    <span>Home</span>
  </a>

  <a href="task-form.html">
    <span class="icon">➕</span>
    <span>Add</span>
  </a>

  <a href="task-list.html">
    <span class="icon">📋</span>
    <span>List</span>
  </a>

  <a href="notification-settings.html">
    <span class="icon">⚙️</span>
    <span>Setting</span>
  </a>
</nav>

</body>
</html>
