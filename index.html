<!DOCTYPE html>
<html lang="ja" class="auth-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ランダム通知リマインダー</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="リマインダー">
</head>

<body class="has-fixed-header">
  <div id="nav-drawer-backdrop" class="nav-drawer-backdrop"></div>
  <nav id="nav-drawer" class="nav-drawer" aria-hidden="true">
    <div class="nav-drawer-header">
      <span class="nav-drawer-title">メニュー</span>
    </div>
    <ul class="nav-drawer-list">
      <li><a href="completed-tasks.html">完了済みタスク</a></li>
      <li><a href="stats.html">実績・記録</a></li>
      <li><a href="#" id="logout-link" class="is-logout">ログアウト</a></li>
    </ul>
  </nav>

  <header class="top-bar">
    <button id="hamburger-button" class="hamburger-button" type="button" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <h1>ホーム</h1>
  </header>

  <div id="ios-install-banner" class="ios-banner-card" style="display:none;">
    <span class="ios-banner-icon" aria-hidden="true">📲</span>
    <p>iPhoneで通知を受け取るには、共有ボタンから「ホーム画面に追加」し、追加後はホーム画面のアイコンから開いて通知を許可してください。</p>
  </div>

  <section id="home-screen" class="home-screen">
    <section class="home-section" id="current-status-section">
      <h2 class="home-section-title">あなたの現在のステータス</h2>
      <div id="current-status-list" class="current-status-list" aria-live="polite"></div>
    </section>

    <section class="home-section" id="next-task-section" style="display:none;">
      <h2 class="home-section-title">次にやるタスク</h2>
      <div id="next-task-card"></div>
    </section>

    <section class="home-section">
      <h2 class="home-section-title">今日やるべきタスク</h2>
      <div id="today-task-list"></div>
    </section>

    <section class="home-section" id="user-status-section">
      <h2 class="home-section-title">今週の進み具合</h2>
      <div id="user-status-card" class="user-status-card" aria-live="polite"></div>
    </section>

    <section class="home-section">
      <h2 class="home-section-title">成果の確認</h2>
      <div id="home-stats-card" class="home-stats-card"></div>
      <a href="stats.html" class="home-stats-link">実績をもっと見る ›</a>
    </section>
  </section>

  <a href="task-form.html" class="fab-button" aria-label="タスクを追加">+</a>

  <div id="popup-notification" class="popup-notification-overlay" aria-hidden="true">
    <section class="popup-notification" role="dialog" aria-modal="true" aria-labelledby="popup-notification-title">
      <div class="popup-notification-header">
        <h2 id="popup-notification-title">アプリ内通知</h2>
        <button type="button" class="popup-close-button" onclick="closePopupNotification()">閉じる</button>
      </div>
      <p class="popup-notification-lead">今確認したいタスクがあります。</p>
      <div id="popup-notification-list" class="popup-task-list"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="is-active">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>

    <a href="task-list.html">
      <span class="icon">📋</span>
      <span>List</span>
    </a>

    <a href="atodeyaru.html">
      <span class="icon">🕒</span>
      <span>あとで</span>
    </a>

    <a href="notification-settings.html">
      <span class="icon">⚙️</span>
      <span>Setting</span>
    </a>
  </nav>

  <script type="module">
    import { requireAuth } from "./auth-guard.js";
    import { initNavDrawer } from "./nav-drawer.js";
    import { loadTasks, loadCompletedTasks, completeTask as completeTaskInFirestore } from "./tasks-data.js";
    import { getTaskLabel, applyLabelBar, setCustomLabelNames, normalizeImportance, IMPORTANCE_LABELS, normalizeUrgency, URGENCY_LABELS, REPEAT_LABELS, isRepeatingTask } from "./task-labels.js";
    import { loadUserData } from "./user-data.js";
    import { computeCompletionStats } from "./stats.js";
    import { computeUserStatusStats, getUserStatusesFromStats } from "./user-status.js";
    import { celebrateCompletion } from "./celebrate.js";

    let currentUser = null;
    let tasks = [];

    const todayTaskListEl = document.getElementById('today-task-list');
    const nextTaskSection = document.getElementById('next-task-section');
    const nextTaskCardEl = document.getElementById('next-task-card');
    const homeStatsCardEl = document.getElementById('home-stats-card');
    const userStatusCardEl = document.getElementById('user-status-card');
    const currentStatusListEl = document.getElementById('current-status-list');

    function isLaterTask(task) {
      const status = String(task.status || '').trim().toLowerCase();
      return status === '後でやる' || status === 'later' || status.includes('後で');
    }

    function isDoneTask(task) {
      return String(task.status || '').trim() === '完了';
    }

    function getReminderLabel(task) {
      if (task.notifyDate) {
        return `通知日時：${task.notifyDate}${task.time ? ' ' + task.time : ''}`;
      }
      if (task.frequency && task.frequency !== 'none') {
        if (task.frequencyCount) {
          const unitLabel = task.frequencyUnit === 'week' ? '1週間' : '1日';
          return `${unitLabel}に${task.frequencyCount}回くらいランダム通知`;
        }
        const freqLabel = {
          small: '少なめ（1〜2回/日）',
          medium: '普通（3〜4回/日）',
          large: '多め（5〜7回/日）'
        }[task.frequency] || task.frequency;
        return `ランダム通知・${freqLabel}`;
      }
      if (task.dueDate || task.date) {
        return `期限：${task.dueDate || task.date}`;
      }
      return '日時未設定';
    }

    function getLocalTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function normalizeDateValue(value) {
      if (!value) return '';
      return String(value).slice(0, 10);
    }

    function getTaskDueDate(task) {
      return task.dueDate || task.date || '';
    }

    function getTaskTitle(task) {
      return task.title || task.name || '無題のタスク';
    }

    function isTodayTask(task) {
      // urgency未設定の既存タスクを一律「今日やる」扱いにしないよう、明示的にtodayが設定されている場合だけ加味する
      return normalizeDateValue(getTaskDueDate(task)) === getLocalTodayString()
        || task.urgency === 'today';
    }

    function isActiveTask(task) {
      return !isDoneTask(task) && !isLaterTask(task);
    }

    const IMPORTANCE_RANK = { high: 0, medium: 1, low: 2 };

    function pickNextTask(activeTasks) {
      const todaysActive = activeTasks.filter(isTodayTask);
      const pool = todaysActive.length > 0 ? todaysActive : activeTasks;

      return pool.slice().sort((a, b) => {
        const rankA = IMPORTANCE_RANK[normalizeImportance(a.priority || a.importance)];
        const rankB = IMPORTANCE_RANK[normalizeImportance(b.priority || b.importance)];
        if (rankA !== rankB) return rankA - rankB;

        const dueA = getTaskDueDate(a) || '9999-99-99';
        const dueB = getTaskDueDate(b) || '9999-99-99';
        return dueA.localeCompare(dueB);
      })[0] || null;
    }

    function buildMetaPills(task) {
      const importance = normalizeImportance(task.priority || task.importance || task.priorityLevel);
      const urgency = normalizeUrgency(task.urgency);
      const labelMeta = getTaskLabel(task.color);
      const pills = [`<span class="meta-pill meta-pill-importance-${importance}">重要度：${IMPORTANCE_LABELS[importance]}</span>`];
      pills.push(`<span class="meta-pill">予定：${URGENCY_LABELS[urgency]}</span>`);
      if (task.color && task.color !== 'none') {
        pills.push(`<span class="meta-pill meta-pill-label" style="--label-color:${labelMeta.color}">${labelMeta.name}</span>`);
      }
      if (isRepeatingTask(task)) {
        pills.push(`<span class="meta-pill">🔁 ${REPEAT_LABELS[task.repeat] || task.repeat}</span>`);
      }
      return `<div class="meta-pill-row">${pills.join('')}</div>`;
    }

    function renderTodayTasks(activeTasks, nextTask) {
      const todaysActive = activeTasks.filter(isTodayTask).filter((task) => !nextTask || task.id !== nextTask.id);

      todayTaskListEl.innerHTML = '';

      if (todaysActive.length === 0) {
        todayTaskListEl.innerHTML = '<p class="task-list-empty">今日やるべきタスクはありません。のんびりいきましょう。</p>';
        return;
      }

      todaysActive.forEach((task) => {
        const card = document.createElement('div');
        card.className = 'task-card task-card-compact';
        applyLabelBar(card, task.color);

        card.innerHTML = `
          <input type="checkbox" class="task-checkbox" id="complete-${task.id}" aria-label="完了にする">
          <div class="task-info">
            <h3>${getTaskTitle(task)}</h3>
            <p class="task-remind">${getReminderLabel(task)}</p>
            ${buildMetaPills(task)}
          </div>
          <a href="atodeyaru.html?id=${task.id}" class="home-later-link">あとで</a>
        `;

        todayTaskListEl.appendChild(card);
        card.querySelector(`#complete-${task.id}`).addEventListener('change', (event) => {
          handleComplete(task, event.target);
        });
      });
    }

    function renderNextTask(nextTask) {
      if (!nextTask) {
        nextTaskSection.style.display = 'none';
        return;
      }

      nextTaskSection.style.display = '';
      nextTaskCardEl.innerHTML = `
        <div class="task-card next-task-card">
          <div class="task-info">
            <h3>${getTaskTitle(nextTask)}</h3>
            <p class="task-remind">${getReminderLabel(nextTask)}</p>
            ${buildMetaPills(nextTask)}
          </div>
          <div class="task-actions">
            <button id="next-task-complete">完了</button>
            <a href="atodeyaru.html?id=${nextTask.id}" class="button-link btn-secondary home-later-button">あとでやる</a>
          </div>
        </div>
      `;
      applyLabelBar(nextTaskCardEl.querySelector('.next-task-card'), nextTask.color);

      document.getElementById('next-task-complete').addEventListener('click', (event) => {
        handleComplete(nextTask, null, event.target);
      });
    }

    async function handleComplete(task, checkbox, triggerButton) {
      if (!confirm('このタスクを完了にしますか？')) {
        if (checkbox) checkbox.checked = false;
        return;
      }
      await completeTaskInFirestore(currentUser.uid, task);
      tasks = tasks.filter((t) => t.id !== task.id);
      celebrateCompletion();
      render();
    }

    async function renderHomeStats(completedTasks) {
      const completedTaskList = Array.isArray(completedTasks)
        ? completedTasks
        : await loadCompletedTasks(currentUser.uid);
      const stats = computeCompletionStats(completedTaskList);

      homeStatsCardEl.innerHTML = `
        <div class="stat-tile">
          <span class="stat-tile-value">${stats.todayCount}</span>
          <span class="stat-tile-label">今日の完了</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-value">${stats.weekCount}</span>
          <span class="stat-tile-label">今週の完了</span>
        </div>
        <div class="stat-tile stat-tile-accent">
          <span class="stat-tile-value">${stats.fromLaterCount}</span>
          <span class="stat-tile-label">あとでから完了</span>
        </div>
      `;
    }

    function formatPercent(value) {
      const percent = Number(value) * 100;
      if (!Number.isFinite(percent)) return 0;
      return Math.max(0, Math.min(100, Math.round(percent)));
    }

    function formatBestWeekdays(bestWeekdays) {
      if (!Array.isArray(bestWeekdays) || bestWeekdays.length === 0) return 'まだ集計中';
      return bestWeekdays.map((day) => `${day}曜日`).join(' / ');
    }

    function getUserStatusMessage(stats) {
      if (stats.todayCompletedCount === 0) {
        return '今日はまだ完了タスクがありません。まずは1つ進めてみましょう。';
      }
      if (stats.postponedCompletedCount > 0) {
        return 'あとでにしたタスクも、最終的に完了できています。';
      }
      return '少しずつ進めていきましょう。';
    }

    function renderCurrentStatuses(stats) {
      if (!currentStatusListEl) return;

      const statuses = getUserStatusesFromStats(stats);
      currentStatusListEl.innerHTML = '';

      if (!Array.isArray(statuses) || statuses.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'current-status-empty';
        empty.textContent = 'ステータスはまだ集計中です。少しずつタスクを進めていきましょう。';
        currentStatusListEl.appendChild(empty);
        return;
      }

      statuses.forEach((status) => {
        const card = document.createElement('article');
        card.className = 'current-status-card';

        if (status.image) {
          const image = document.createElement('img');
          image.className = 'current-status-image';
          image.src = status.image;
          image.alt = status.name || 'ステータス画像';
          image.loading = 'lazy';
          image.addEventListener('error', () => {
            image.remove();
          });
          card.appendChild(image);
        }

        const body = document.createElement('div');
        body.className = 'current-status-body';

        const title = document.createElement('h3');
        title.className = 'current-status-name';
        title.textContent = status.name || '現在のステータス';

        const description = document.createElement('p');
        description.className = 'current-status-description';
        description.textContent = status.description || '今日も少しずつ進めていきましょう。';

        body.appendChild(title);
        body.appendChild(description);
        card.appendChild(body);
        currentStatusListEl.appendChild(card);
      });
    }

    function renderUserStatus(completedTasks) {
      if (!userStatusCardEl) return;

      const stats = computeUserStatusStats(tasks, completedTasks);
      const completionRate = formatPercent(stats.completionRate);
      const postponeRate = formatPercent(stats.postponeRate);

      userStatusCardEl.innerHTML = `
        <div class="user-status-grid">
          <div class="user-status-item">
            <span class="user-status-value">${stats.todayCompletedCount}</span>
            <span class="user-status-label">今日の完了</span>
            <span class="user-status-unit">個</span>
          </div>
          <div class="user-status-item">
            <span class="user-status-value">${stats.weeklyCompletedCount}</span>
            <span class="user-status-label">今週の完了</span>
            <span class="user-status-unit">個</span>
          </div>
          <div class="user-status-item">
            <span class="user-status-value">${stats.postponedCompletedCount}</span>
            <span class="user-status-label">あとでから完了</span>
            <span class="user-status-unit">個</span>
          </div>
          <div class="user-status-item user-status-item-wide">
            <span class="user-status-label">よくできた曜日</span>
            <span class="user-status-text">${formatBestWeekdays(stats.bestWeekdays)}</span>
          </div>
          <div class="user-status-item">
            <span class="user-status-value">${completionRate}%</span>
            <span class="user-status-label">達成率</span>
          </div>
          <div class="user-status-item">
            <span class="user-status-value">${postponeRate}%</span>
            <span class="user-status-label">後でやる使用率</span>
          </div>
        </div>
        <p class="user-status-message">${getUserStatusMessage(stats)}</p>
      `;

      renderCurrentStatuses(stats);
    }

    function render() {
      const activeTasks = tasks.filter(isActiveTask);
      const nextTask = pickNextTask(activeTasks);
      renderNextTask(nextTask);
      renderTodayTasks(activeTasks, nextTask);
    }

    async function loadPopupTasks() {
      return tasks;
    }

    function getTaskPriority(task) {
      return task.priority || task.importance || task.priorityLevel || '-';
    }

    function formatPopupPriority(priority) {
      return IMPORTANCE_LABELS[normalizeImportance(priority)];
    }

    function isImportantTask(task) {
      return normalizeImportance(getTaskPriority(task)) === 'high';
    }

    function getPopupNotificationReasons(task) {
      const reasons = [];

      if (isTodayTask(task)) reasons.push('期限が今日');
      if (isImportantTask(task)) reasons.push('重要度が高い');
      if (isLaterTask(task)) reasons.push('後でやる設定');

      return reasons;
    }

    async function checkPopupNotifications() {
      const currentTasks = await loadPopupTasks();
      const notificationTasks = currentTasks
        .map(function(task) {
          return Object.assign({}, task, {
            notificationReasons: getPopupNotificationReasons(task)
          });
        })
        .filter(function(task) {
          return task.notificationReasons.length > 0;
        });

      if (notificationTasks.length > 0) {
        showPopupNotifications(notificationTasks);
      }
    }

    function showPopupNotifications(popupTasks) {
      const popup = document.getElementById('popup-notification');
      const list = document.getElementById('popup-notification-list');

      if (!popup || !list) return;

      list.innerHTML = '';

      popupTasks.forEach(function(task) {
        const item = document.createElement('article');
        item.className = 'popup-task-item';

        const title = document.createElement('h3');
        title.textContent = getTaskTitle(task);

        const dueDate = document.createElement('p');
        dueDate.textContent = `期限: ${getTaskDueDate(task) || '未設定'}`;

        const priority = document.createElement('p');
        priority.textContent = `重要度: ${formatPopupPriority(getTaskPriority(task))}`;

        const reason = document.createElement('p');
        reason.className = 'popup-task-reason';
        reason.textContent = `通知理由: ${task.notificationReasons.join(' / ')}`;

        item.appendChild(title);
        item.appendChild(dueDate);
        item.appendChild(priority);
        item.appendChild(reason);
        list.appendChild(item);
      });

      popup.classList.add('is-visible');
      popup.setAttribute('aria-hidden', 'false');
    }

    function closePopupNotification() {
      const popup = document.getElementById('popup-notification');
      if (!popup) return;

      popup.classList.remove('is-visible');
      popup.setAttribute('aria-hidden', 'true');
    }
    window.closePopupNotification = closePopupNotification;

    async function init() {
      currentUser = await requireAuth();
      initNavDrawer();
      const userData = await loadUserData(currentUser.uid);
      setCustomLabelNames(userData && userData.labelNames);
      tasks = await loadTasks(currentUser.uid);
      const completedTasks = await loadCompletedTasks(currentUser.uid);
      render();
      renderUserStatus(completedTasks);
      renderHomeStats(completedTasks);
      checkPopupNotifications();
    }

    init();
  </script>

  <script type="module">
    console.log("Firebase通知コード開始");

    import { app } from "./firebase-init.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-messaging.js";
    import { VAPID_KEY } from "./fcm-config.js";
    import { requireAuth } from "./auth-guard.js";
    import { saveFcmToken } from "./user-data.js";
    import { isPushSupported, isIosDevice, isStandaloneDisplayMode } from "./pwa-notifications.js";

    function updateIosInstallBanner() {
      const banner = document.getElementById('ios-install-banner');
      if (banner && isIosDevice() && !isStandaloneDisplayMode()) {
        banner.style.display = 'flex';
      }
    }

    async function requestNotificationPermission() {
      updateIosInstallBanner();

      if (!isPushSupported() || (isIosDevice() && !isStandaloneDisplayMode())) {
        console.log("この環境では通知に対応していません");
        return;
      }

      try {
        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
          console.log("通知が許可されませんでした");
          return;
        }

        const swRegistration = await navigator.serviceWorker.register("firebase-messaging-sw.js");
        await navigator.serviceWorker.ready;
        const messaging = getMessaging(app);
        const token = await getToken(messaging, {
          vapidKey: VAPID_KEY,
          serviceWorkerRegistration: swRegistration
        });

        if (token) {
          console.log("FCMトークン:", token);
          const user = await requireAuth();
          await saveFcmToken(user.uid, token);
        } else {
          console.log("FCMトークンを取得できませんでした");
        }
      } catch (error) {
        console.error("通知許可またはトークン取得でエラー:", error);
      }
    }

    requestNotificationPermission();
  </script>
</body>
</html>
