<!DOCTYPE html>
<html lang="ja" class="auth-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダム通知リマインダー</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="home-page">
  <h1>ランダム通知リマインダー</h1>

  <main class="home-main">
    <section class="notification-card">
      <div class="notification-icon">🔔</div>

      <h2>通知を確認した？</h2>
      <p>未完了のタスクがないか確認しよう</p>

      <a href="task-list.html" class="button-link">タスクを確認する</a>
    </section>
  </main>

  <div id="popup-notification" class="popup-notification-overlay" aria-hidden="true">
    <section class="popup-notification" role="dialog" aria-modal="true" aria-labelledby="popup-notification-title">
      <div class="popup-notification-header">
        <h2 id="popup-notification-title">アプリ内通知</h2>
        <button type="button" class="popup-close-button" onclick="closePopupNotification()">閉じる</button>
      </div>
      <p class="popup-notification-lead">今確認したいタスクがあります。</p>
      <div id="popup-notification-list" class="popup-task-list"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>

    <a href="task-form.html">
      <span class="icon">➕</span>
      <span>Add</span>
    </a>

    <a href="task-list.html">
      <span class="icon">📋</span>
      <span>List</span>
    </a>

    <a href="notification-settings.html">
      <span class="icon">⚙️</span>
      <span>Setting</span>
    </a>
  </nav>
  <script type="module">
    import { requireAuth } from "./auth-guard.js";
    import { loadTasks } from "./tasks-data.js";

    let currentUser = null;

    async function loadPopupTasks() {
      if (!currentUser) return [];
      try {
        return await loadTasks(currentUser.uid);
      } catch (error) {
        console.error("タスク取得エラー:", error);
        return [];
      }
    }

    function getLocalTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function normalizeDateValue(value) {
      if (!value) return '';
      return String(value).slice(0, 10);
    }

    function getTaskDueDate(task) {
      return task.dueDate || task.date || '';
    }

    function getTaskTitle(task) {
      return task.title || task.name || '無題のタスク';
    }

    function getTaskPriority(task) {
      return task.priority || task.importance || task.priorityLevel || '-';
    }

    function formatPopupPriority(priority) {
      const value = String(priority || '').trim().toLowerCase();

      if (value === 'high' || value === '高' || value.includes('高') || value.includes('鬮')) return '高';
      if (value === 'low' || value === '低' || value.includes('低') || value.includes('菴')) return '低';
      if (value === 'medium' || value === '中' || value.includes('中') || value.includes('荳')) return '中';
      return priority || '-';
    }

    function isTodayTask(task) {
      return normalizeDateValue(getTaskDueDate(task)) === getLocalTodayString();
    }

    function isImportantTask(task) {
      const priority = String(getTaskPriority(task)).trim().toLowerCase();
      return priority === 'high' || priority === '高' || priority.includes('高') || priority.includes('鬮');
    }

    function isLaterTask(task) {
      const status = String(task.status || '').trim().toLowerCase();
      return task.later === true ||
        task.doLater === true ||
        task.isLater === true ||
        task.remindLater === true ||
        task.laterTask === true ||
        task.snoozed === true ||
        task.postponed === true ||
        status === '後でやる' ||
        status === 'later' ||
        status.includes('後で') ||
        status.includes('蠕後〒');
    }

    function getTodayTasks(tasks) {
      return (tasks || loadPopupTasks()).filter(isTodayTask);
    }

    function getImportantTasks(tasks) {
      return (tasks || loadPopupTasks()).filter(isImportantTask);
    }

    function getLaterTasks(tasks) {
      return (tasks || loadPopupTasks()).filter(isLaterTask);
    }

    function getPopupNotificationReasons(task) {
      const reasons = [];

      if (isTodayTask(task)) reasons.push('期限が今日');
      if (isImportantTask(task)) reasons.push('重要度が高い');
      if (isLaterTask(task)) reasons.push('後でやる設定');

      return reasons;
    }

    async function checkPopupNotifications() {
      const tasks = await loadPopupTasks();
      const notificationTasks = tasks
        .map(function(task) {
          return Object.assign({}, task, {
            notificationReasons: getPopupNotificationReasons(task)
          });
        })
        .filter(function(task) {
          return task.notificationReasons.length > 0;
        });

      if (notificationTasks.length > 0) {
        showPopupNotifications(notificationTasks);
      }
    }

    function showPopupNotifications(tasks) {
      const popup = document.getElementById('popup-notification');
      const list = document.getElementById('popup-notification-list');

      if (!popup || !list) return;

      list.innerHTML = '';

      tasks.forEach(function(task) {
        const item = document.createElement('article');
        item.className = 'popup-task-item';

        const title = document.createElement('h3');
        title.textContent = getTaskTitle(task);

        const dueDate = document.createElement('p');
        dueDate.textContent = `期限: ${getTaskDueDate(task) || '未設定'}`;

        const priority = document.createElement('p');
        priority.textContent = `重要度: ${formatPopupPriority(getTaskPriority(task))}`;

        const reason = document.createElement('p');
        reason.className = 'popup-task-reason';
        reason.textContent = `通知理由: ${task.notificationReasons.join(' / ')}`;

        item.appendChild(title);
        item.appendChild(dueDate);
        item.appendChild(priority);
        item.appendChild(reason);
        list.appendChild(item);
      });

      popup.classList.add('is-visible');
      popup.setAttribute('aria-hidden', 'false');
    }

    function closePopupNotification() {
      const popup = document.getElementById('popup-notification');
      if (!popup) return;

      popup.classList.remove('is-visible');
      popup.setAttribute('aria-hidden', 'true');
    }
    window.closePopupNotification = closePopupNotification;

    async function init() {
      currentUser = await requireAuth();
      checkPopupNotifications();

      const showButton = document.querySelector('.notification-card .button-link');
      if (showButton) {
        showButton.addEventListener('click', function() {
          checkPopupNotifications();
        });
      }
    }

    init();
  </script>

  <script type="module">
    console.log("Firebase通知コード開始");

    import { app } from "./firebase-init.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-messaging.js";
    import { VAPID_KEY } from "./fcm-config.js";
    import { requireAuth } from "./auth-guard.js";
    import { saveFcmToken } from "./user-data.js";

    const messaging = getMessaging(app);

    async function requestNotificationPermission() {
      try {
        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
          console.log("通知が許可されませんでした");
          return;
        }

        const token = await getToken(messaging, {
          vapidKey: VAPID_KEY
        });

        if (token) {
          console.log("FCMトークン:", token);
          const user = await requireAuth();
          await saveFcmToken(user.uid, token);
        } else {
          console.log("FCMトークンを取得できませんでした");
        }
      } catch (error) {
        console.error("通知許可またはトークン取得でエラー:", error);
      }
    }

    requestNotificationPermission();
  </script>
</body>
</html>
