<!DOCTYPE html>
<html lang="ja" class="auth-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知設定</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="リマインダー">
</head>
<body class="notification-settings-page">
  <h1>通知設定</h1>

  <section id="user-info" class="user-info"></section>
  <button id="logout-button" type="button" class="btn-secondary">ログアウト</button>

  <section id="push-notification-section" class="card">
    <h2>通知の利用状況</h2>
    <p id="ios-install-banner" style="display:none;">iPhoneで通知を受け取るには、共有ボタンから「ホーム画面に追加」してください。</p>
    <p id="unsupported-banner" style="display:none;">この環境では通知に対応していません。</p>
    <div id="permission-section" style="display:none;">
      <button id="request-permission-button" type="button" class="btn-secondary">通知を許可する</button>
      <p id="permission-status"></p>
    </div>
  </section>

  <form id="settings-form">
    <!-- 通知の頻度はタスクごとに設定するため、この画面では削除しました -->

    <h2>① 通知をランダムに実行していい時間帯（起きている時間）</h2>
    <label>
      開始時刻: <input id="start-time" type="time" name="start-time" value="09:00">
    </label>
    <br>
    <label>
      終了時刻: <input id="end-time" type="time" name="end-time" value="21:00">
    </label>

    <h2>② 通知を辞めてほしい時間を個別に設定する時間</h2>
    <div id="exclude-times-container">
      <div class="exclude-time-item">
        <input type="time" name="exclude-start" placeholder="開始時刻">
        <span>～</span>
        <input type="time" name="exclude-end" placeholder="終了時刻">
        <button type="button" onclick="removeExcludeTime(this)">削除</button>
      </div>
    </div>
    <button type="button" class="add-button" onclick="addExcludeTime()">+ 時間帯を追加</button>

    <h2>通知タイプ（デフォルト）</h2>
    <p>ここで設定した通知タイプはタスク側で個別に上書きできます。</p>
    <label>
      <input type="checkbox" name="notification-type" value="line" checked> LINE
    </label>
    <label>
      <input type="checkbox" name="notification-type" value="browser"> ブラウザ通知
    </label>
    <label>
      <input type="checkbox" name="notification-type" value="sound"> 音声通知
    </label>

    <h2>その他</h2>
    <label>
      <input type="checkbox" name="enable-notification" value="enabled" checked> 通知を有効にする
    </label>

    <div style="margin-top: 20px;">
      <button type="submit">保存</button>
      <button type="button" onclick="history.back()">戻る</button>
    </div>
  </form>

  <script>
    function addExcludeTime(startVal, endVal) {
      const container = document.getElementById('exclude-times-container');
      const newItem = document.createElement('div');
      newItem.className = 'exclude-time-item';
      newItem.innerHTML = `
        <input type="time" name="exclude-start" placeholder="開始時刻">
        <span>～</span>
        <input type="time" name="exclude-end" placeholder="終了時刻">
        <button type="button" onclick="removeExcludeTime(this)">削除</button>
      `;
      if (startVal) newItem.querySelector('[name="exclude-start"]').value = startVal;
      if (endVal) newItem.querySelector('[name="exclude-end"]').value = endVal;
      container.appendChild(newItem);
    }

    function removeExcludeTime(button) {
      button.parentElement.remove();
    }
  </script>

  <script type="module">
    import { requireAuth, logout } from "./auth-guard.js";
    import { loadUserData, saveNotificationSettings, saveFcmToken } from "./user-data.js";
    import { app } from "./firebase-init.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-messaging.js";
    import { VAPID_KEY } from "./fcm-config.js";
    import { isPushSupported, isIosDevice, isStandaloneDisplayMode } from "./pwa-notifications.js";

    let currentUser = null;

    function updatePermissionStatus() {
      const statusEl = document.getElementById('permission-status');
      if (Notification.permission === 'granted') {
        statusEl.textContent = '通知が使える状態です。';
      } else if (Notification.permission === 'denied') {
        statusEl.textContent = '通知がブロックされています。端末の設定アプリから通知を許可してください。';
      } else {
        statusEl.textContent = '';
      }
    }

    function initPushNotificationSection() {
      const iosBanner = document.getElementById('ios-install-banner');
      const unsupportedBanner = document.getElementById('unsupported-banner');
      const permissionSection = document.getElementById('permission-section');

      if (!isPushSupported()) {
        unsupportedBanner.style.display = 'block';
        return;
      }

      if (isIosDevice() && !isStandaloneDisplayMode()) {
        iosBanner.style.display = 'block';
        return;
      }

      permissionSection.style.display = 'block';
      updatePermissionStatus();

      document.getElementById('request-permission-button').addEventListener('click', async () => {
        try {
          const permission = await Notification.requestPermission();
          updatePermissionStatus();

          if (permission === 'granted') {
            const messaging = getMessaging(app);
            const token = await getToken(messaging, { vapidKey: VAPID_KEY });
            if (token) await saveFcmToken(currentUser.uid, token);
          }
        } catch (error) {
          console.error("通知許可またはトークン取得でエラー:", error);
        }
      });
    }

    function renderUserInfo(user) {
      const userInfo = document.getElementById('user-info');
      userInfo.innerHTML = '';

      if (user.photoURL) {
        const avatar = document.createElement('img');
        avatar.src = user.photoURL;
        avatar.alt = '';
        userInfo.appendChild(avatar);
      }

      const textWrap = document.createElement('div');

      const name = document.createElement('div');
      name.className = 'user-name';
      name.textContent = user.displayName || 'ユーザー';
      textWrap.appendChild(name);

      const email = document.createElement('div');
      email.className = 'user-email';
      email.textContent = user.email || '';
      textWrap.appendChild(email);

      userInfo.appendChild(textWrap);
    }

    function populateSettingsForm(settings) {
      if (!settings) return;

      if (settings.startTime) document.getElementById('start-time').value = settings.startTime;
      if (settings.endTime) document.getElementById('end-time').value = settings.endTime;

      if (Array.isArray(settings.excludeTimes) && settings.excludeTimes.length > 0) {
        document.getElementById('exclude-times-container').innerHTML = '';
        settings.excludeTimes.forEach((range) => {
          addExcludeTime(range.start, range.end);
        });
      }

      if (Array.isArray(settings.notificationTypes)) {
        document.querySelectorAll('input[name="notification-type"]').forEach((cb) => {
          cb.checked = settings.notificationTypes.includes(cb.value);
        });
      }

      const enableCheckbox = document.querySelector('input[name="enable-notification"]');
      if (enableCheckbox && typeof settings.enabled === 'boolean') {
        enableCheckbox.checked = settings.enabled;
      }
    }

    function collectExcludeTimes() {
      const items = document.querySelectorAll('#exclude-times-container .exclude-time-item');
      const ranges = [];
      items.forEach((item) => {
        const start = item.querySelector('[name="exclude-start"]').value;
        const end = item.querySelector('[name="exclude-end"]').value;
        if (start && end) ranges.push({ start, end });
      });
      return ranges;
    }

    async function init() {
      currentUser = await requireAuth();
      renderUserInfo(currentUser);
      initPushNotificationSection();

      const userData = await loadUserData(currentUser.uid);
      if (userData && userData.notificationSettings) {
        populateSettingsForm(userData.notificationSettings);
      }
    }

    document.getElementById('settings-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const settings = {
        startTime: document.getElementById('start-time').value,
        endTime: document.getElementById('end-time').value,
        excludeTimes: collectExcludeTimes(),
        notificationTypes: Array.from(document.querySelectorAll('input[name="notification-type"]:checked')).map((cb) => cb.value),
        enabled: document.querySelector('input[name="enable-notification"]').checked
      };

      await saveNotificationSettings(currentUser.uid, settings);
      alert('保存しました');
    });

    document.getElementById('logout-button').addEventListener('click', () => {
      logout();
    });

    init();
  </script>

  <nav class="bottom-nav">
  <a href="index.html">
    <span class="icon">🏠</span>
    <span>Home</span>
  </a>

  <a href="task-form.html">
    <span class="icon">➕</span>
    <span>Add</span>
  </a>

  <a href="task-list.html">
    <span class="icon">📋</span>
    <span>List</span>
  </a>

  <a href="notification-settings.html">
    <span class="icon">⚙️</span>
    <span>Setting</span>
  </a>
</nav>

</body>
</html>
