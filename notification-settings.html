<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>通知設定</title>
  <style>
    .frequency-container {
      margin-top: 10px;
    }
    .frequency-item {
      margin: 15px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .frequency-item h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
    }
    .frequency-value {
      min-width: 30px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>通知設定</h1>

  <form>
    <h2>通知の頻度</h2>
    <div class="frequency-container">
      <div class="frequency-item">
        <h3>小（1～3）</h3>
        <div class="slider-container">
          <input type="range" name="frequency-small" min="1" max="3" value="1">
          <span class="frequency-value" id="frequency-small-value">1</span>
        </div>
      </div>

      <div class="frequency-item">
        <h3>中（4～6）</h3>
        <div class="slider-container">
          <input type="range" name="frequency-medium" min="4" max="6" value="4">
          <span class="frequency-value" id="frequency-medium-value">4</span>
        </div>
      </div>

      <div class="frequency-item">
        <h3>大（7～9）</h3>
        <div class="slider-container">
          <input type="range" name="frequency-large" min="7" max="9" value="7">
          <span class="frequency-value" id="frequency-large-value">7</span>
        </div>
      </div>
    </div>

    <h2>通知時間帯</h2>
    <label>
      開始時刻: <input type="time" name="start-time" value="09:00">
    </label>
    <label>
      終了時刻: <input type="time" name="end-time" value="21:00">
    </label>

    <h2>通知タイプ</h2>
    <label>
      <input type="checkbox" name="notification-type" value="line" checked> LINE
    </label>
    <label>
      <input type="checkbox" name="notification-type" value="browser"> ブラウザ通知
    </label>
    <label>
      <input type="checkbox" name="notification-type" value="sound"> 音声通知
    </label>

    <h2>その他</h2>
    <label>
      <input type="checkbox" name="enable-notification" value="enabled" checked> 通知を有効にする
    </label>

    <div style="margin-top: 20px;">
      <button type="submit">保存</button>
      <button type="button" onclick="history.back()">戻る</button>
    </div>
  </form>

  <script>
    // 小の頻度スライダーの値表示
    document.querySelector('input[name="frequency-small"]').addEventListener('input', function() {
      document.getElementById('frequency-small-value').textContent = this.value;
    });

    // 中の頻度スライダーの値表示
    document.querySelector('input[name="frequency-medium"]').addEventListener('input', function() {
      document.getElementById('frequency-medium-value').textContent = this.value;
    });

    // 大の頻度スライダーの値表示
    document.querySelector('input[name="frequency-large"]').addEventListener('input', function() {
      document.getElementById('frequency-large-value').textContent = this.value;
    });
  </script>
</body>
</html>
