<!DOCTYPE html>
<html lang="ja" class="auth-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>実績・記録</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="リマインダー">
</head>
<body class="stats-page has-fixed-header">
  <div id="nav-drawer-backdrop" class="nav-drawer-backdrop"></div>
  <nav id="nav-drawer" class="nav-drawer" aria-hidden="true">
    <div class="nav-drawer-header">
      <span class="nav-drawer-title">メニュー</span>
    </div>
    <ul class="nav-drawer-list">
      <li><a href="completed-tasks.html">完了済みタスク</a></li>
      <li><a href="stats.html">実績・記録</a></li>
      <li><a href="#" id="logout-link" class="is-logout">ログアウト</a></li>
    </ul>
  </nav>

  <header class="top-bar">
    <button id="hamburger-button" class="hamburger-button" type="button" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <h1>実績・記録</h1>
  </header>

  <section id="stats-screen">
    <div class="stat-tile-grid">
      <div class="stat-tile">
        <span class="stat-tile-value" id="stat-today">0</span>
        <span class="stat-tile-label">今日の完了</span>
      </div>
      <div class="stat-tile">
        <span class="stat-tile-value" id="stat-week">0</span>
        <span class="stat-tile-label">今週の完了</span>
      </div>
      <div class="stat-tile stat-tile-accent">
        <span class="stat-tile-value" id="stat-from-later">0</span>
        <span class="stat-tile-label">あとでから完了</span>
      </div>
    </div>

    <div class="card stat-weekday-card">
      <h2>よくできた曜日</h2>
      <p id="stat-weekday">まだデータがありません</p>
    </div>

    <p class="stat-footnote">「あとでから完了」は、一度でも後回しにしたタスクを最後までやり切れた数です。先延ばしからの巻き返しも、ちゃんと成果としてカウントします。</p>
  </section>

  <nav class="bottom-nav">
    <a href="index.html">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>

    <a href="task-list.html">
      <span class="icon">📋</span>
      <span>List</span>
    </a>

    <a href="atodeyaru.html">
      <span class="icon">🕒</span>
      <span>あとで</span>
    </a>

    <a href="notification-settings.html">
      <span class="icon">⚙️</span>
      <span>Setting</span>
    </a>
  </nav>

  <script type="module">
    import { requireAuth } from "./auth-guard.js";
    import { initNavDrawer } from "./nav-drawer.js";
    import { loadRecentCompletedTasks } from "./tasks-data.js";
    import { computeCompletionStats } from "./stats.js";

    async function init() {
      const currentUser = await requireAuth();
      initNavDrawer();

      const completedTasks = await loadRecentCompletedTasks(currentUser.uid);
      const stats = computeCompletionStats(completedTasks);

      document.getElementById('stat-today').textContent = stats.todayCount;
      document.getElementById('stat-week').textContent = stats.weekCount;
      document.getElementById('stat-from-later').textContent = stats.fromLaterCount;
      document.getElementById('stat-weekday').textContent = stats.bestWeekdays.length > 0
        ? `${stats.bestWeekdays.map((day) => `${day}曜日`).join('・')}`
        : 'まだデータがありません';
    }

    init();
  </script>
</body>
</html>
