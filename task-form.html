<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タスク登録 / 編集</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>タスクを登録 / 編集</h1>

  <form id="task-form">
    <div class="form-group">
      <label for="task-name">タスク名</label>
      <input id="task-name" name="name" type="text" required>
    </div>

    <div class="form-group">
      <label for="task-desc">説明（任意）</label>
      <textarea id="task-desc" name="description" rows="3"></textarea>
    </div>

    <div class="form-group">
      <label for="task-time">通知日時（任意）</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input id="task-notify-date" name="notifyDate" type="date" style="width:160px">
        <input id="task-time" name="time" type="time" style="width:120px">
        <span class="small">※日付を指定すると指定日・時刻に通知、未指定なら毎日の指定時刻に通知されます</span>
      </div>
    </div>

    <div class="form-group">
      <label>このタスクの通知を有効にする</label>
      <input id="task-enable" name="enabled" type="checkbox" checked>
    </div>

    <div class="form-group">
      <label>通知の頻度（タスク単位）</label>
      <div class="radios">
        <label><input type="radio" name="frequency" value="small"> 小（1〜3）</label>
        <label><input type="radio" name="frequency" value="medium" checked> 中（4〜6）</label>
        <label><input type="radio" name="frequency" value="large"> 大（7〜9）</label>
      </div>
    </div>

    <div class="form-group">
      <label for="task-due">期限（期日）</label>
      <input id="task-due" name="dueDate" type="date">
    </div>

    <div class="form-group">
      <label for="task-repeat">提出頻度（繰り返し）</label>
      <select id="task-repeat" name="repeatType">
        <option value="none">なし（単発）</option>
        <option value="daily">毎日</option>
        <option value="weekly">毎週</option>
        <option value="monthly">毎月</option>
        <option value="custom">カスタム（N日ごと）</option>
      </select>
      <div id="custom-repeat" style="display:none; margin-top:8px;">
        <label class="inline">間隔（日）: <input id="task-repeat-interval" type="number" min="1" value="1" style="width:80px"></label>
      </div>
    </div>

    <div class="form-group">
      <label>通知タイプ（タスクの個別設定）</label>
      <label><input type="checkbox" name="notification-type" value="line" checked> LINE</label>
      <label><input type="checkbox" name="notification-type" value="browser"> ブラウザ通知</label>
      <label><input type="checkbox" name="notification-type" value="sound"> 音声通知</label>
    </div>

    <div class="actions">
      <button type="submit">保存</button>
      <button type="button" onclick="location.href='task-list.html'">キャンセル</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('task-form');
    const params = new URLSearchParams(location.search);
    const editId = params.get('id');

    function loadTasks() { return JSON.parse(localStorage.getItem('tasks') || '[]'); }
    function saveTasks(tasks) { localStorage.setItem('tasks', JSON.stringify(tasks)); }

    const repeatSelect = document.getElementById('task-repeat');
    const customRepeat = document.getElementById('custom-repeat');
    repeatSelect.addEventListener('change', () => {
      customRepeat.style.display = repeatSelect.value === 'custom' ? 'block' : 'none';
    });

    function populateForm(task) {
      document.getElementById('task-name').value = task.name || task.title || '';
      document.getElementById('task-desc').value = task.description || task.memo || '';
      document.getElementById('task-time').value = task.time || '';
      document.getElementById('task-notify-date').value = task.notifyDate || task.notificationDate || '';
      document.getElementById('task-enable').checked = !!task.enabled;
      const freq = task.frequency || 'medium';
      const freqInput = document.querySelector(`input[name="frequency"][value="${freq}"]`);
      if (freqInput) freqInput.checked = true;
      const types = task.notificationTypes || [];
      document.querySelectorAll('input[name="notification-type"]').forEach(cb => { cb.checked = types.includes(cb.value); });

      document.getElementById('task-due').value = task.dueDate || task.date || '';
      if (task.repeat) {
        document.getElementById('task-repeat').value = task.repeat.type || 'none';
        if (task.repeat.type === 'custom') {
          document.getElementById('task-repeat-interval').value = task.repeat.interval || 1;
          customRepeat.style.display = 'block';
        }
      }
    }

    if (editId) {
      const tasks = loadTasks();
      const task = tasks.find(t => t.id === editId);
      if (task) populateForm(task);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const tasks = loadTasks();
      const formData = new FormData(form);
      const repeatType = formData.get('repeatType');
      const repeat = repeatType === 'none' ? null : {
        type: repeatType,
        interval: repeatType === 'custom' ? parseInt(document.getElementById('task-repeat-interval').value || '1', 10) : undefined
      };

      const taskObj = {
        id: editId || Date.now().toString(),
        name: formData.get('name'),
        title: formData.get('name'), // keep both title and name for compatibility
        description: formData.get('description'),
        memo: formData.get('description'),
        time: formData.get('time'),
        notifyDate: formData.get('notifyDate') || null,
        enabled: document.getElementById('task-enable').checked,
        frequency: formData.get('frequency') || 'medium',
        notificationTypes: formData.getAll('notification-type'),
        dueDate: formData.get('dueDate') || null,
        repeat: repeat
      };

      if (editId) {
        const idx = tasks.findIndex(t => t.id === editId);
        if (idx !== -1) tasks[idx] = taskObj;
        else tasks.push(taskObj);
      } else {
        tasks.push(taskObj);
      }
      saveTasks(tasks);
      alert('保存しました');
      location.href = 'task-list.html';
    });
  </script>
</body>
</html>
