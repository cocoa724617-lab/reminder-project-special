<!DOCTYPE html>
<html lang="ja" class="auth-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク登録 / 編集</title>
<link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="リマインダー">
</head>
<body class="task-form-page">
  <h1>タスクを登録 / 編集</h1>

  <form id="task-form">
    <div class="form-group">
      <label for="task-name">タスク名</label>
      <input id="task-name" name="name" type="text" required>
    </div>

    <div class="form-group">
      <label for="task-desc">説明（任意）</label>
      <textarea id="task-desc" name="description" rows="3"></textarea>
    </div>

    <div class="form-group">
      <label for="task-time">通知日時（頻度が「無し」の場合のみ必須）</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input id="task-notify-date" name="notifyDate" type="date" style="width:160px">
        <input id="task-time" name="time" type="time" style="width:120px">
        <span class="small">※頻度を選んだ場合は毎日ランダムな時間に通知されるため、ここは空欄でOKです</span>
      </div>
    </div>

    <div class="form-group">
      <label>このタスクの通知を有効にする</label>
      <input id="task-enable" name="enabled" type="checkbox" checked>
    </div>

    <div class="form-group">
      <label>通知の頻度（1日あたり・タスク単位）</label>
      <div class="radios">
        <label><input type="radio" name="frequency" value="none"> 無し</label>
        <label><input type="radio" name="frequency" value="small"> 小（1〜2回/日）</label>
        <label><input type="radio" name="frequency" value="medium" checked> 中（3〜4回/日）</label>
        <label><input type="radio" name="frequency" value="large"> 大（5〜7回/日）</label>
      </div>
      <span class="small">「無し」以外を選ぶと、タスクを完了にするまで毎日ランダムな時間に通知します（通知してよい時間帯は⚙️設定で変更できます）</span>
    </div>

    <div class="form-group">
      <label for="task-due">期限（期日）</label>
      <input id="task-due" name="dueDate" type="date">
    </div>

    <div class="form-group">
      <label for="task-priority">重要度</label>
      <select id="task-priority" name="priority">
        <option value="low">低</option>
        <option value="medium" selected>中</option>
        <option value="high">高</option>
      </select>
    </div>

    <div class="form-group">
      <label for="task-repeat">提出頻度（繰り返し）</label>
      <select id="task-repeat" name="repeatType">
        <option value="none">なし（単発）</option>
        <option value="daily">毎日</option>
        <option value="weekly">毎週</option>
        <option value="monthly">毎月</option>
        <option value="custom">カスタム（N日ごと）</option>
      </select>
      <div id="custom-repeat" style="display:none; margin-top:8px;">
        <label class="inline">間隔（日）: <input id="task-repeat-interval" type="number" min="1" value="1" style="width:80px"></label>
      </div>
    </div>

    <div class="form-group">
      <label>通知タイプ（タスクの個別設定）</label>
      <label><input type="checkbox" name="notification-type" value="line" checked> LINE</label>
      <label><input type="checkbox" name="notification-type" value="browser"> ブラウザ通知</label>
      <label><input type="checkbox" name="notification-type" value="sound"> 音声通知</label>
    </div>

    <div class="actions">
      <button id="saveTaskButton" type="button">保存</button>
      <button type="button" onclick="location.href='task-list.html'">キャンセル</button>
    </div>
  </form>

  <script type="module">
    import { requireAuth } from "./auth-guard.js";
    import { loadTask, saveTask } from "./tasks-data.js";
    import { app, db } from "./firebase-init.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-messaging.js";
    import {
      collection,
      addDoc,
      serverTimestamp,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    import { VAPID_KEY } from "./fcm-config.js";
    import { saveFcmToken } from "./user-data.js";
    import { isPushSupported, isIosDevice, isStandaloneDisplayMode } from "./pwa-notifications.js";

    const form = document.getElementById('task-form');
    const params = new URLSearchParams(location.search);
    const editId = params.get('id');

    const repeatSelect = document.getElementById('task-repeat');
    const customRepeat = document.getElementById('custom-repeat');
    repeatSelect.addEventListener('change', () => {
      customRepeat.style.display = repeatSelect.value === 'custom' ? 'block' : 'none';
    });

    function normalizePriorityValue(priority) {
      const value = String(priority || '').trim().toLowerCase();

      if (value === 'high' || value === '高' || value.includes('高') || value.includes('鬮')) return 'high';
      if (value === 'low' || value === '低' || value.includes('低') || value.includes('菴')) return 'low';
      return 'medium';
    }

    function populateForm(task) {
      document.getElementById('task-name').value = task.name || task.title || '';
      document.getElementById('task-desc').value = task.description || task.memo || '';
      document.getElementById('task-time').value = task.time || '';
      document.getElementById('task-notify-date').value = task.notifyDate || task.notificationDate || '';
      document.getElementById('task-enable').checked = !!task.enabled;
      const freq = task.frequency || 'medium';
      const freqInput = document.querySelector(`input[name="frequency"][value="${freq}"]`);
      if (freqInput) freqInput.checked = true;
      const types = task.notificationTypes || [];
      document.querySelectorAll('input[name="notification-type"]').forEach(cb => { cb.checked = types.includes(cb.value); });

      document.getElementById('task-due').value = task.dueDate || task.date || '';
      document.getElementById('task-priority').value = normalizePriorityValue(task.priority || task.importance || task.priorityLevel || 'medium');
      if (task.repeat) {
        document.getElementById('task-repeat').value = task.repeat.type || 'none';
        if (task.repeat.type === 'custom') {
          document.getElementById('task-repeat-interval').value = task.repeat.interval || 1;
          customRepeat.style.display = 'block';
        }
      }
    }

    window.currentFcmToken = null;

    async function saveReminderToFirestore(taskId, uid, title, remindAt, token) {
      try {
        const docRef = await addDoc(collection(db, "reminders"), {
          taskId: taskId,
          uid: uid,
          title: title,
          body: "リマインダー通知です",
          remindAt: Timestamp.fromDate(new Date(remindAt)),
          fcmToken: token,
          notified: false,
          createdAt: serverTimestamp()
        });
        console.log("Firestore保存成功:", docRef.id);
      } catch (error) {
        console.error("Firestore保存エラー:", error);
      }
    }

    async function requestNotificationPermission() {
      if (!isPushSupported() || (isIosDevice() && !isStandaloneDisplayMode())) {
        console.log("この環境では通知に対応していません");
        return;
      }

      try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          console.log("通知が許可されませんでした");
          return;
        }
        const messaging = getMessaging(app);
        const token = await getToken(messaging, { vapidKey: VAPID_KEY });
        if (token) {
          console.log("FCMトークン:", token);
          window.currentFcmToken = token;
          if (currentUser) await saveFcmToken(currentUser.uid, token);
        } else {
          console.log("FCMトークンを取得できませんでした");
        }
      } catch (error) {
        console.error("通知許可またはトークン取得でエラー:", error);
      }
    }

    let currentUser = null;
    let existingTask = null;

    async function init() {
      currentUser = await requireAuth();
      requestNotificationPermission();

      if (editId) {
        existingTask = await loadTask(currentUser.uid, editId);
        if (existingTask) populateForm(existingTask);
      }

      document.getElementById('saveTaskButton').addEventListener('click', onSave);
    }

    async function onSave() {
      const formData = new FormData(form);
      const frequency = formData.get('frequency') || 'medium';

      const errors = [];
      if (!formData.get('name') || !formData.get('name').trim()) {
        errors.push('・タスク名を入力してください');
      }
      if (frequency === 'none') {
        if (!formData.get('notifyDate')) {
          errors.push('・通知日付を入力してください');
        }
        if (!formData.get('time')) {
          errors.push('・通知時刻を入力してください');
        }
      }
      if (!window.currentFcmToken) {
        errors.push('・通知が許可されていません。ブラウザの通知を許可してからもう一度お試しください');
      }

      if (errors.length > 0) {
        alert('以下の項目を確認してください：\n\n' + errors.join('\n'));
        return;
      }

      const repeatType = formData.get('repeatType');
      const repeat = repeatType === 'none' ? null : {
        type: repeatType,
        interval: repeatType === 'custom' ? parseInt(document.getElementById('task-repeat-interval').value || '1', 10) : undefined
      };

      const taskObj = {
        id: editId || null,
        name: formData.get('name'),
        title: formData.get('name'),
        description: formData.get('description'),
        memo: formData.get('description'),
        time: formData.get('time'),
        notifyDate: formData.get('notifyDate'),
        enabled: document.getElementById('task-enable').checked,
        status: (existingTask && existingTask.status) || '未完了',
        frequency: frequency,
        priority: formData.get('priority') || 'medium',
        notificationTypes: formData.getAll('notification-type'),
        dueDate: formData.get('dueDate') || null,
        repeat: repeat
      };

      const savedId = await saveTask(currentUser.uid, taskObj);

      if (frequency === 'none') {
        const remindAt = taskObj.notifyDate + "T" + taskObj.time + ":00+09:00";
        console.log("Firestoreに保存開始:", taskObj.name, remindAt);
        await saveReminderToFirestore(savedId, currentUser.uid, taskObj.name, remindAt, window.currentFcmToken);
      }

      alert('保存しました');
      location.href = 'task-list.html';
    }

    init();
  </script>

<nav class="bottom-nav">
  <a href="index.html">
    <span class="icon">🏠</span>
    <span>Home</span>
  </a>

  <a href="task-form.html">
    <span class="icon">➕</span>
    <span>Add</span>
  </a>

  <a href="task-list.html">
    <span class="icon">📋</span>
    <span>List</span>
  </a>

  <a href="notification-settings.html">
    <span class="icon">⚙️</span>
    <span>Setting</span>
  </a>
</nav>

</body>
</html>
